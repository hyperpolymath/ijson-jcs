# KYAML content; retain the filename required by GitHub.
{
  version: 2,
  updates: [
    {
      package-ecosystem: "cargo",
      directory: "/",
      schedule: {
        interval: "weekly",
      },
      open-pull-requests-limit: 5,
      groups: {
        rust-dependencies: {
          patterns: [
            "*",
          ],
        },
      },
    },
    {
      package-ecosystem: "cargo",
      directory: "/fuzz",
      schedule: {
        interval: "weekly",
      },
      open-pull-requests-limit: 2,
    },
    {
      package-ecosystem: "github-actions",
      directory: "/",
      schedule: {
        interval: "weekly",
      },
      open-pull-requests-limit: 5,
    },
  ],
}
