# SPDX-License-Identifier: MPL-2.0
# Cross-repository reusable: deliberately not onboarded in actions.lock.
name: Rust CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-ci:
    uses: hyperpolymath/proven-cicd/.github/workflows/rust-ci.yml@f98f9b975de43c3fcb36188843ee351a415fe057
