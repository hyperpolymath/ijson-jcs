#
# I-JSON (RFC 7493) validator + JCS (RFC 8785) canonicalizer
# Forked and enhanced from meta-repos/groove/cli/src/canonical.rs

[package]
name = "ijson-jcs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
authors = ["Hyperpolymath Estate"]
description = "I-JSON validation and JCS canonicalization library for deterministic JSON handling"
license = "MPL-2.0"
repository = "https://github.com/hyperpolymath/ijson-jcs"
keywords = ["json", "ijson", "jcs", "canonical", "signing"]
categories = ["encoding", "data-structures", "cryptography"]

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
ryu-js = "1.0.3"

[dev-dependencies]
proptest = { version = "=1.9.0", default-features = false, features = ["std"] }

[features]
default = ["std"]
std = []

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "jcs"
harness = false
