    required: {
      name: "Required CI",
      if: "${{ always() }}",
      needs: [
        "quality",
        "test",
        "conformance",
        "benchmarks",
        "recon",
        "hypatia",
        "squabble",
        "security",
        "fuzz",
      ],
      runs-on: "ubuntu-24.04",
      timeout-minutes: 5,
      steps: [
        {
          name: "Every mandatory lane must actually succeed",
          run: "jq -e 'length == 9 and all(.[]; .result == \"success\")' <<< \"$NEEDS\"",
          env: {
            NEEDS: "${{ toJSON(needs) }}",
          },
        },
      ],
    },
  },
