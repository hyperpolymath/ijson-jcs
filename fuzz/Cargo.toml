# SPDX-License-Identifier: MPL-2.0
[package]
name = "ijson-jcs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
ijson-jcs = { path = ".." }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "numbers"
path = "fuzz_targets/numbers.rs"
test = false
doc = false
bench = false
