# KYAML content; retain the filename required by GitHub.
{
  name: "CodeQL",
  on: {
    workflow_call: {},
    workflow_dispatch: {},
  },
  permissions: {
    contents: "read",
    actions: "read",
  },
  defaults: {
    run: {
      shell: "bash",
    },
  },
  jobs: {
    analyze: {
      name: "CodeQL ${{ matrix.language }}",
      runs-on: "ubuntu-24.04",
      timeout-minutes: 30,
      steps: [
        {
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            persist-credentials: false,
          },
        },
        {
          name: "Pinned Rust",
          run: "rustup show active-toolchain",
        },
        {
          uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9", # v6.1.0
          with: {
            path: "~/.cargo/registry\n~/.cargo/git\ntarget",
            key: "rust-${{ runner.os }}-${{ github.job }}-${{ env.RUSTUP_TOOLCHAIN || '1.99.1' }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.ci/pins.sh') }}",
          },
        },
        {
          name: "Fresh evidence directory",
          run: "rm -rf target/ci target/tmp && mkdir -p target/ci",
        },
        {
          name: "Initialize CodeQL",
          uses: "github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63", # v4.38.0, estate-approved
          with: {
            languages: "${{ matrix.language }}",
            build-mode: "none",
          },
        },
        {
          name: "Analyze and retain SARIF",
          uses: "github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63", # v4.38.0
          with: {
            category: "/language:${{ matrix.language }}",
            output: "target/ci/codeql",
            wait-for-processing: true,
          },
        },
        {
          name: "Gate actual SARIF findings",
          run: "bash scripts/ci/run.sh codeql bash scripts/ci/codeql-report.sh",
        },
        {
          name: "Canonical execution receipts",
          run: "bash scripts/ci/finalize-evidence.sh",
          if: "${{ always() }}",
        },
        {
          name: "Retain execution evidence",
          if: "${{ always() }}",
          uses: "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f", # v6.0.0
          with: {
            name: "evidence-codeql-${{ matrix.language }}",
            path: "target/ci/",
            if-no-files-found: "error",
            retention-days: 30,
          },
        },
      ],
      permissions: {
        contents: "read",
        actions: "read",
        security-events: "write",
      },
      strategy: {
        fail-fast: false,
        matrix: {
          language: [
            "rust",
            "actions",
          ],
        },
      },
    },
  },
}
