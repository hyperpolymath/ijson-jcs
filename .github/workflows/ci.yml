# KYAML content; GitHub requires the .yml extension.
{
  name: "CI",
  on: {
    pull_request: {},
    push: {
      branches: [
        "main",
        "arena/d216802e-ijson-jcs",
      ],
    },
    merge_group: {},
    workflow_dispatch: {},
  },
  permissions: {
    contents: "read",
  },
  concurrency: {
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    cancel-in-progress: true,
  },
  jobs: {
    rust: {
      name: "Rust",
      runs-on: "ubuntu-24.04",
      timeout-minutes: 15,
      steps: [
        {
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            persist-credentials: false,
          },
        },
        {
          name: "Install pinned Rust toolchain",
          run: "set -euo pipefail\ncommand -v rustup >/dev/null || { echo '::error::rustup is not on this runner, so the toolchain pinned in rust-toolchain.toml cannot be installed'; exit 2; }\nrustup show active-toolchain",
        },
        {
          name: "Bootstrap registry lock and formatting",
          run: "bash scripts/ci/run.sh bootstrap bash scripts/ci/bootstrap.sh",
        },
        {
          name: "Test library, CLI and documentation",
          run: "bash scripts/ci/run.sh tests cargo test --locked --all-features",
        },
        {
          name: "Formatting",
          run: "bash scripts/ci/run.sh format cargo fmt --all -- --check",
        },
        {
          name: "Clippy",
          run: "bash scripts/ci/run.sh clippy cargo clippy --locked --all-targets --all-features -- -D warnings",
        },
      ],
    },
    standards: {
      name: "Standards pipeline",
      runs-on: "ubuntu-24.04",
      timeout-minutes: 45,
      steps: [
        {
          uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", # v7.0.1
          with: {
            persist-credentials: false,
            fetch-depth: 0,
          },
        },
        {
          name: "Install pinned Rust toolchain",
          run: "set -euo pipefail\ncommand -v rustup >/dev/null || { echo '::error::rustup is not on this runner, so the toolchain pinned in rust-toolchain.toml cannot be installed'; exit 2; }\nrustup show active-toolchain",
        },
        {
          # No binary and no network needed: this is the durable part.
          name: "Pipeline self-test (fetch, contract, detect, propose)",
          run: "bash scripts/tests/standards-inputs-test.sh",
        },
        {
          # Fail-closed: pinned inputs, contract, build, tests, the pinned
          # standards gate and its failure controls, profile/JSONL/JSON-LD
          # vectors, and the receipt itself. A missing tool or fixture fails
          # this step; nothing here is allowed to skip.
          name: "Verify the pinned standards revision",
          run: "bash scripts/ci/run.sh standards bash scripts/standards/verify.sh --receipt target/ci/receipt.json --label ci",
        },
        {
          # The receipt is the run's evidence; it is short enough to publish as
          # one annotation, which is also how it is copied into .ci/receipts/.
          name: "Publish the receipt",
          run: "printf '::notice title=standards-receipt::%s\\n' \"$(cat target/ci/receipt.json)\"",
        },
      ],
    },
  },
}
