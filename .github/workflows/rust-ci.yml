# SPDX-License-Identifier: MPL-2.0
# Cross-repository reusable: deliberately not onboarded in actions.lock.
name: Rust CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-ci:
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/rust-ci.yml@6a35e510a41037adfd422b7f449c3503c5e26a98
